packages:
  - "."

# Approve build scripts needed by the generated Worker's dependencies.
allowBuilds:
  esbuild: true
  workerd: true
  # Only the Tailwind CLI's --watch uses it; the one-off build doesn't.
  "@parcel/watcher": false

minimumReleaseAgeExclude:
  - "@recranet/worker-site-editor@20261127.0.7 || 20261127.0.7"
